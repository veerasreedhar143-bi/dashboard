{% extends "employee/base.html" %}

{% block overlay %}

<style>

/* Blur Dashboard */
#dashboardContent{
    filter: blur(5px);
}

/* Overlay background */
.login-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(1px);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

/* Login Card */
.login-box{
    background:lightgrey;
    padding:40px 35px;
    border-radius:12px;
    width:320px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

/* Login Title */
.login-box h2{
    margin-bottom:25px;
    color:#2c3e50;
    font-weight:600;
}

/* Input fields */
.login-box input{
    width:100%;
    padding:10px 12px;
    margin-bottom:15px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
    transition:0.3s;
}

/* Input focus */
.login-box input:focus{
    border-color:#6c63ff;
    box-shadow:0 0 5px rgba(108,99,255,0.5);
    outline:none;
}

/* Login Button */
.login-box button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    background:#2c3e50;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
}

/* Button hover */
.login-box button:hover{
    background:#1a252f;
}

</style>

<div class="login-overlay">

    <div class="login-box">

        <h2>Login</h2>

        <form method="POST">
            {% csrf_token %}
            {% if error %}
            <p style="color:red;">{{ error }}</p>
            {% endif %}
            <input type="email" name="username" placeholder="Email">

            <input type="password" name="password" placeholder="Password">

            <button type="submit">Login</button>

        </form>

    </div>

</div>

{% endblock %}
