{% extends "employee/base.html" %}

{% block content %}

<div class="add_page">

<h2>Employee List</h2>

<table>

<tr>
<th>Employee Name</th>
<th>Employee Id</th>
<th>Job Role</th>
<th>Department</th>
<th>Actions</th>
</tr>

{% for e in employees %}

<tr>

<td>{{ e.employee_name }}</td>
<td>{{ e.employee_id }}</td>
<td>{{ e.job_role }}</td>
<td>{{ e.department }}</td>

<td>

<span>
<a href="/delete_employee/{{ e.id }}/"
onclick="return confirm('Are you sure?')">
Delete
</a>
</span>

&nbsp;&nbsp;

<span>
<a href="/update_employee/{{ e.id }}/">
Update
</a>
</span>

</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/e/add_employee/" class="btn-add">
Add Employee
</a>

</div>

{% endblock %}
