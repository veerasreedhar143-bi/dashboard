<div class="employee-profile-page">

    <div class="employee-profile-wrapper">

        <!-- LEFT LIST -->
        <div class="employee-profile-list">
            {% for emp in employees %}
                <div class="emp-name" data-id="{{ emp.id }}">
                    {{ emp.employee_name }}
                </div>
            {% endfor %}
        </div>

        <!-- RIGHT PANEL -->
        <div class="employee-profile-view" id="profileView">
            <h3 class="placeholder">Select employee to view profile</h3>
        </div>

    </div>

</div>
